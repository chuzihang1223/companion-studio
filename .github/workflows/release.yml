name: Windows Release Draft
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag to build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Validate immutable version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid version tag' }
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne ('v' + $version)) { throw 'Tag/package version mismatch' }
          $tagCommit = git rev-parse --verify ('refs/tags/' + $env:RELEASE_TAG + '^{}')
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne (git rev-parse HEAD)) { throw 'Checkout must match the immutable tag' }
      - name: Install locked build environment
        shell: pwsh
        run: |
          $env:electron_config_cache = Join-Path $env:RUNNER_TEMP 'electron'
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r backend\requirements-dev.txt
          npm.cmd ci --prefix desktop --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          node desktop/node_modules/esbuild/install.js
          node desktop/node_modules/electron/install.js
      - name: Validate source, tests and history
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build and audit Windows installer
        shell: pwsh
        run: |
          # npm invokes Windows PowerShell 5.1. A pwsh runner can otherwise pass
          # only PowerShell 7 module paths, hiding the built-in Get-FileHash.
          $winPSModules = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'
          $env:PSModulePath = $winPSModules + [IO.Path]::PathSeparator + $env:PSModulePath
          powershell.exe -NoProfile -NonInteractive -Command 'Get-Command Get-FileHash -ErrorAction Stop | Out-Null'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell built-in module preflight failed' }
          npm.cmd run build:public --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'Windows production build failed' }
      - name: Create draft with audited assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = Get-Content build/latest.json -Raw | ConvertFrom-Json
          $delivery = $latest.delivery
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = 'v' + $version
          $setup = Join-Path $delivery ('Companion-Studio-' + $version + '-Setup.exe')
          $notes = 'docs/RELEASE_NOTES_' + $version + '.md'
          if (-not (Test-Path $notes)) { throw 'Reviewed release notes missing' }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Existing published release is immutable' }
            throw 'Draft already exists; inspect it before explicitly retrying asset upload'
          }
          gh release create $tag $setup (Join-Path $delivery 'SHA256SUMS.txt') (Join-Path $delivery 'build-manifest.json') (Join-Path $delivery 'security-audit.json') --verify-tag --draft --title ('Companion Studio ' + $version + ' — Windows Desktop') --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed' }
      - name: Preserve audited delivery for maintainer review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-review
          path: |
            build/*/delivery/*Setup.exe
            build/*/delivery/SHA256SUMS.txt
            build/*/delivery/build-manifest.json
            build/*/delivery/security-audit.json
          if-no-files-found: warn
