name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked development dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r backend\requirements-dev.txt
          npm.cmd ci --prefix desktop --ignore-scripts --no-fund --no-audit
          node desktop/node_modules/esbuild/install.js
      - name: Static checks, mock regressions, source and history audit
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Keep test results (no runtime profiles)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automated-check-results
          path: |
            .cache/checks/pytest.xml
            .cache/checks/*audit.json
          if-no-files-found: warn
      - name: Evaluation Mock integration (no paid services)
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B -m pytest backend/tests/test_benchmark_case.py backend/tests/test_evaluation_system.py -q --basetemp .cache/evaluation-ci-temp --junitxml .cache/checks/evaluation.xml
          node tests/ui/evaluation-unit.cjs
      - name: Keep synthetic evaluation test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-mock-results
          path: |
            .cache/checks/evaluation.xml
          if-no-files-found: warn
